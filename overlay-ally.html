<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarvelCounters — Overlay equipo aliado</title>
<!--
  Overlay de solo lectura para stream (OBS Browser Source / celular en vivo).
  No tiene UI propia de seleccion -- lee el equipo aliado que armaste en
  MarvelCountersPrime.html via localStorage (clave "overlayAllyTeam", ver
  syncAllyOverlay() en assets/js/team-state.js) y se actualiza solo.

  Requisito: esta pagina y MarvelCountersPrime.html tienen que estar
  serviadas desde el MISMO origen (mismo dominio/puerto) para compartir
  localStorage -- por eso no funciona abriendo el archivo suelto con
  doble clic si la otra pagina esta en un origen distinto.
-->
<style>
  :root{
    --panel:#191b22cc; --panel-empty:#191b2255; --line:#2c2f3a;
    --gold:#ffc145; --text:#f2f3f6; --muted:#9195a3;
    --vg:#ff8a3d; --du:#ff3b4e; --st:#3ecf8e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Inter',ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
  }
  .panel{
    width:min(340px,92vw); margin:14px; display:flex; flex-direction:column; gap:8px;
  }
  .panel-label{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800;
    color:var(--gold); padding:0 2px;
  }
  .row{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:7px 12px 7px 7px; min-height:52px;
    backdrop-filter:blur(2px);
    transition:opacity .15s;
  }
  .row.empty{ background:var(--panel-empty); border-style:dashed; }
  .row .icon{
    width:38px; height:38px; border-radius:8px; object-fit:cover; flex:none;
    background:#0007;
  }
  .row .icon.placeholder{ background:#0004; }
  .row .name{ font-weight:700; font-size:15px; flex:1 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.empty .name{ color:var(--muted); font-weight:500; font-style:italic; }
  .row .role-badge{
    display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:100px; flex:none;
  }
  .role-badge.Vanguard{ color:var(--vg); background:#ff8a3d22; }
  .role-badge.Duelist{ color:var(--du); background:#ff3b4e22; }
  .role-badge.Strategist{ color:var(--st); background:#3ecf8e22; }
  .role-badge img{ width:13px; height:13px; }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-label">Tu equipo</div>
  <div id="rows"></div>
</div>

<script src="assets/data/hero-images.js"></script>
<script src="assets/data/role-icons.js"></script>
<script>
const DEADPOOL_DISPLAY_NAMES = {
  "Deadpool (Vanguard)": "Tankpool",
  "Deadpool (Duelist)": "Deadpool",
  "Deadpool (Strategist)": "Healpool",
};
const ROLE_LABEL_ES = { Vanguard:"Vanguardia", Duelist:"Duelista", Strategist:"Estratega" };

function heroLabel(name){
  if(DEADPOOL_DISPLAY_NAMES[name]) return DEADPOOL_DISPLAY_NAMES[name];
  return name.replace(/ \((Vanguard|Duelist|Strategist)\)$/, "");
}
function getHeroImage(name){
  const pre = window.PRELOADED_IMAGES && window.PRELOADED_IMAGES[name];
  if(!pre) return null;
  if(pre.default) return pre.default.img;
  const firstKey = Object.keys(pre)[0];
  return firstKey ? pre[firstKey].img : null;
}
function getRoleIconImage(role){
  const pre = window.PRELOADED_ROLE_ICONS && window.PRELOADED_ROLE_ICONS[role];
  return pre ? pre.img : null;
}

function renderTeam(team){
  const rowsEl = document.getElementById("rows");
  const slots = Array.isArray(team) ? team.slice(0,6) : [];
  while(slots.length < 6) slots.push(null);
  rowsEl.innerHTML = slots.map(h=>{
    if(!h) return `<div class="row empty"><img class="icon placeholder" alt=""><div class="name">—</div></div>`;
    const img = getHeroImage(h.n);
    const roleImg = getRoleIconImage(h.r);
    const roleLabel = ROLE_LABEL_ES[h.r] || h.r || "";
    return `<div class="row">
      ${img ? `<img class="icon" src="${img}" alt="${heroLabel(h.n)}">` : `<img class="icon placeholder" alt="">`}
      <div class="name">${heroLabel(h.n)}</div>
      <div class="role-badge ${h.r||''}">${roleImg?`<img src="${roleImg}" alt="">`:""}${roleLabel}</div>
    </div>`;
  }).join("");
}

function loadAndRender(){
  let team = [];
  try{ team = JSON.parse(localStorage.getItem("overlayAllyTeam") || "[]"); }catch(e){ team = []; }
  renderTeam(team);
}

loadAndRender();
window.addEventListener("storage", (e)=>{ if(e.key==="overlayAllyTeam") loadAndRender(); });
// respaldo por si el evento "storage" no llega (algunas versiones de CEF/OBS) -- barato, solo lee localStorage
setInterval(loadAndRender, 1200);
</script>
</body>
</html>
