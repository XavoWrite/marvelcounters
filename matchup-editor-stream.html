<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchups en vivo — Marvel Counters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<!-- iconos reales de heroes/roles -- mismos archivos que usa la app real, solo referenciados
     (no duplicados) para que las tarjetas se vean como en la pestaña Personajes -->
<script src="assets/data/role-icons.js"></script>
<script src="assets/data/hero-images.js"></script>
<style>
  :root{
    --bg:#0c0d11; --panel:#191b22; --panel-alt:#20232c; --line:#33363f;
    --text:#f2f3f6; --muted:#9195a3; --gold:#ffc145;
    --c-neutral:#33363f; --c-danger:#ff3b4e; --c-good:#3e8eff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:'Inter',sans-serif;color:var(--text);}

  /* ancho de referencia para tu region de captura en OBS/TikTok, pero el alto crece con el
     contenido -- la pagina completa scrollea (una sola barra), no cada tabla por separado. */
  .square{
    width:100vmin;min-height:100vmin;margin:0 auto;
    background:var(--bg);
    display:flex;flex-direction:column;
    border:2px solid var(--line);
  }

  header{padding:3vmin 3vmin 1.5vmin;flex-shrink:0;}
  h1{font-family:'Anton',sans-serif;font-size:4.2vmin;margin:0;text-transform:uppercase;line-height:1;}
  h1 span{color:var(--gold);}
  .sub{color:var(--muted);font-size:1.6vmin;margin-top:.6vmin;}

  .top-controls{display:flex;gap:1.2vmin;padding:0 3vmin 1.5vmin;flex-shrink:0;flex-wrap:wrap;align-items:center;}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:1vmin 2vmin;border-radius:1.2vmin;
    font-weight:700;font-size:1.6vmin;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn.gold{background:var(--gold);color:#1a1200;border:none;}
  .btn.small{font-size:1.4vmin;padding:.8vmin 1.6vmin;}
  input[type=text]{background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
    padding:1vmin 1.6vmin;border-radius:1.2vmin;font-size:1.7vmin;flex:1;min-width:20vmin;}
  input[type=text]:focus{outline:none;border-color:var(--gold);}

  .hero-picker{display:none;padding:0 3vmin 1.5vmin;flex-shrink:0;}
  .hero-picker.open{display:block;}
  .role-tabs{display:flex;gap:.8vmin;margin-bottom:1vmin;}
  .role-tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:.7vmin 1.6vmin;
    border-radius:1vmin;font-size:1.5vmin;font-weight:700;cursor:pointer;}
  .role-tab.active{color:var(--text);border-color:var(--gold);background:var(--panel-alt);}
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11vmin,1fr));gap:.8vmin;max-height:22vmin;overflow-y:auto;}
  .pick-card{background:var(--panel-alt);border:1.5px solid var(--line);border-radius:1vmin;padding:1vmin .6vmin;
    text-align:center;cursor:pointer;font-size:1.4vmin;font-weight:700;}
  .pick-card:hover{border-color:var(--gold);}
  .pick-card-icon{width:4.2vmin;height:4.2vmin;border-radius:50%;object-fit:cover;margin:0 auto .5vmin;display:block;background:var(--panel);}
  .pick-card .prog{display:block;font-size:1.1vmin;color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:400;margin-top:.3vmin;}

  .score-hint{padding:0 3vmin 1.5vmin;flex-shrink:0;font-size:1.4vmin;color:var(--muted);display:flex;gap:2.2vmin;flex-wrap:wrap;}
  .score-hint b{color:var(--gold);}
  .score-hint .k{display:inline-flex;align-items:center;gap:.5vmin;}
  .kbd{background:var(--panel);border:1px solid var(--line);border-radius:.6vmin;padding:.2vmin 1vmin;font-family:'JetBrains Mono',monospace;font-size:1.3vmin;}

  .target-banner{background:var(--panel);border:2px solid var(--gold);border-radius:1.5vmin;padding:1.4vmin 2.4vmin;
    margin:0 3vmin 1.8vmin;flex-shrink:0;display:flex;align-items:center;gap:1.5vmin;flex-wrap:wrap;}
  .t-icon{width:5.2vmin;height:5.2vmin;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;}
  .t-info{flex:1;display:flex;flex-direction:column;gap:.2vmin;}
  .t-name{font-family:'Anton',sans-serif;font-size:3.2vmin;color:var(--gold);text-transform:uppercase;line-height:1;}
  .t-progress{font-size:1.5vmin;color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:600;}

  .matchup-scroll{padding:0 20px 24px;}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start;}
  .board-col{background:var(--panel-alt);border:1px solid var(--line);border-top:3px solid var(--line);
    border-radius:10px;padding:10px 12px;transition:.1s;}
  .board-col.drag-over{background:var(--panel);border-style:dashed;}
  .board-col-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .board-col-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;}
  .board-col-count{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;flex-shrink:0;}
  .board-col-body{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;min-height:34px;}
  .board-col-empty{color:var(--muted);font-size:11px;font-style:italic;}
  .hero-card{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:3px 10px 3px 3px;font-size:11.5px;font-weight:700;
    cursor:grab;user-select:none;transition:.12s;}
  .hero-card:hover{border-color:var(--gold);background:var(--panel-alt);transform:translateY(-1px);}
  .hero-card:active{cursor:grabbing;}
  .hero-card.dragging{opacity:.3;}
  .hero-card-icon{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--panel-alt);}
  .hero-card .score-tag{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;
    padding:1px 6px;border-radius:10px;border:1px solid var(--muted);flex-shrink:0;}

  .overall{padding:0 3vmin 1.2vmin;font-size:1.4vmin;color:var(--muted);font-family:'JetBrains Mono',monospace;flex-shrink:0;}
</style>
</head>
<body>
<div class="square" id="squareFrame">

  <header>
    <h1>MATCHUPS <span>EN VIVO</span></h1>
    <p class="sub">Ayúdenme a clasificar — arrastrá cada rival a su tabla correcta</p>
  </header>

  <div class="top-controls">
    <button class="btn" id="toggleHeroPicker">🔄 Cambiar héroe</button>
    <button class="btn gold small" id="exportBtn">⬇️ Exportar</button>
    <label class="btn small" style="cursor:pointer;">⬆️ Importar<input type="file" accept="application/json" id="importInput" style="display:none;"></label>
  </div>

  <div class="hero-picker" id="heroPicker">
    <input type="text" id="heroSearch" placeholder="Buscar héroe...">
    <div class="role-tabs" id="roleTabs">
      <button class="role-tab active" data-role="">Todos</button>
      <button class="role-tab" data-role="Vanguard">Vanguard</button>
      <button class="role-tab" data-role="Duelist">Duelist</button>
      <button class="role-tab" data-role="Strategist">Strategist</button>
    </div>
    <div class="pick-grid" id="pickGrid"></div>
  </div>

  <div class="score-hint">
    <span class="k"><span class="kbd">arrastrar</span> cambia de tabla</span>
    <span class="k"><span class="kbd">click izq</span> +1 punto</span>
    <span class="k"><span class="kbd">click der</span> -1 punto</span>
    <span><b>Puntaje -8 a +8</b> — positivo: ESE rival le va bien al héroe de arriba. Se edita también el lado contrario automáticamente (siempre, en espejo exacto).</span>
  </div>

  <div class="overall" id="overallProgress"></div>

  <div id="targetBannerWrap"></div>
  <div class="matchup-scroll">
    <div class="board" id="board"></div>
  </div>

</div>

// iconos reales, tomados directo de los mismos archivos que carga la app (assets/data/
// hero-images.js y role-icons.js) -- version simplificada de heroIconHtml/roleIconHtml de
// team-state.js, sin el hover-preview/variantes alternativas que no hacen falta aca.
function heroIconSrc(name){
  const pre = window.PRELOADED_IMAGES && window.PRELOADED_IMAGES[name];
  if(!pre) return "";
  const variant = pre.default ? "default" : Object.keys(pre)[0];
  return (pre[variant] && pre[variant].img) || "";
}
function roleIconSrc(role){
  const pre = window.PRELOADED_ROLE_ICONS && window.PRELOADED_ROLE_ICONS[role];
  return (pre && pre.img) || "";
}

let scores = JSON.parse(JSON.stringify(SEED_SCORES));
let selectedHero = HEROES[0].n;
let roleFilter = "";
const MIN_SCORE = -8, MAX_SCORE = 8;

function load(){
  try{ const r=localStorage.getItem("matchupScores"); if(r) scores=JSON.parse(r); }catch(e){}
}
function save(){
  try{ localStorage.setItem("matchupScores", JSON.stringify(scores)); }catch(e){}
}
function countClassified(name){
  const row = scores[name] || {};
  return Object.keys(row).filter(k=>row[k]!==undefined).length;
}
// el par es uno solo, no dos independientes: editar H->X SIEMPRE actualiza X->H con el inverso
// exacto, sin excepcion (antes solo se sugeria si el otro lado estaba vacio, lo que en la practica
// nunca pasaba porque los datos precargados ya traen ambos lados llenos -- por eso el espejo
// parecia no funcionar nunca).
function setScore(x,y,value){
  value = Math.max(MIN_SCORE, Math.min(MAX_SCORE, value));
  if(!scores[x]) scores[x]={};
  scores[x][y] = value;
  if(y!==x){
    if(!scores[y]) scores[y]={};
    scores[y][x] = -value;
  }
  save();
}
// las 5 tablas, mismo orden/nombres/colores que la pestaña Personajes de la app real
// (assets/js/tabs-editor.js + assets/css/styles.css tier-red/orange/neutral/favor/blue) --
// "boundary" es el puntaje al que se ajusta un rival cuando lo arrastras a esa tabla (el
// minimo que alcanza para calificar ahi, no un valor extremo inventado).
const BUCKETS = [
  {key:"counters", title:h=>`⚔️ Counters de ${h}`,        color:"#ff3b4e", boundary:4,  match:s=>s!==undefined && s>=4},
  {key:"casi",     title:()=>"🟠 Casi counters",           color:"#ff8a3d", boundary:1,  match:s=>s!==undefined && s>=1 && s<4},
  {key:"parejo",   title:()=>"⚪ Parejo",                   color:"#9195a3", boundary:0,  match:s=>s===undefined || s===0},
  {key:"ventaja",  title:()=>"🟢 Con ventaja",              color:"#3ecf8e", boundary:-1, match:s=>s!==undefined && s<=-1 && s>-4},
  {key:"presas",   title:h=>`🛡️ Presas fáciles de ${h}`,  color:"#3e8eff", boundary:-4, match:s=>s!==undefined && s<=-4},
];
function bucketForScore(score){
  return (BUCKETS.find(b=>b.match(score)) || BUCKETS[2]).key;
}
function moveToBucket(heroName, targetKey){
  const row = scores[selectedHero] || {};
  if(bucketForScore(row[heroName]) === targetKey) return; // ya esta en esa tabla, no-op
  const target = BUCKETS.find(b=>b.key===targetKey);
  setScore(selectedHero, heroName, target.boundary);
  renderTarget();
  renderOverall();
}

function renderOverall(){
  const total = HEROES.length;
  const started = HEROES.filter(h=>countClassified(h.n)>0).length;
  document.getElementById("overallProgress").textContent =
    `Progreso: ${started}/${total} héroes con al menos un puntaje puesto`;
}
function renderPickGrid(){
  const grid = document.getElementById("pickGrid");
  const q = document.getElementById("heroSearch").value.trim().toLowerCase();
  grid.innerHTML = "";
  HEROES.filter(h=>h.n.toLowerCase().includes(q) && (!roleFilter||h.r===roleFilter)).forEach(h=>{
    const card = document.createElement("div");
    card.className = "pick-card";
    const iconSrc = heroIconSrc(h.n);
    card.innerHTML = `${iconSrc ? `<img src="${iconSrc}" class="pick-card-icon" alt="">` : ""}${h.n}<span class="prog">${countClassified(h.n)}/53</span>`;
    card.onclick = ()=>{
      selectedHero = h.n;
      document.getElementById("heroPicker").classList.remove("open");
      renderTarget();
    };
    grid.appendChild(card);
  });
}
document.getElementById("heroSearch").addEventListener("input", renderPickGrid);
document.querySelectorAll(".role-tab").forEach(btn=>{
  btn.onclick = ()=>{
    roleFilter = btn.dataset.role;
    document.querySelectorAll(".role-tab").forEach(b=>b.classList.toggle("active", b===btn));
    renderPickGrid();
  };
});
document.getElementById("toggleHeroPicker").onclick = ()=>{
  document.getElementById("heroPicker").classList.toggle("open");
  renderPickGrid();
};

function renderTarget(){
  if(!scores[selectedHero]) scores[selectedHero]={};
  const row = scores[selectedHero];
  const others = HEROES.filter(h=>h.n!==selectedHero);
  const done = others.filter(h=>row[h.n]!==undefined).length;

  const selectedRole = (HEROES.find(h=>h.n===selectedHero) || {}).r;
  const selectedIcon = heroIconSrc(selectedHero);
  const selectedRoleIcon = roleIconSrc(selectedRole);
  document.getElementById("targetBannerWrap").innerHTML = `
    <div class="target-banner">
      ${selectedIcon ? `<img src="${selectedIcon}" class="t-icon" alt="">` : ""}
      <div class="t-info">
        <span class="t-name">${selectedHero}</span>
        <span class="t-progress">${selectedRoleIcon ? `<img src="${selectedRoleIcon}" style="width:1.6vmin;height:1.6vmin;vertical-align:-2px;margin-right:.4vmin;">` : ""}${done}/${others.length} con puntaje</span>
      </div>
    </div>`;

  const board = document.getElementById("board");
  board.innerHTML = "";

  BUCKETS.forEach(b=>{
    const heroesInBucket = others.filter(h=>bucketForScore(row[h.n])===b.key);

    const col = document.createElement("div");
    col.className = "board-col";
    col.style.borderTopColor = b.color;
    col.innerHTML = `
      <div class="board-col-head">
        <div class="board-col-title" style="color:${b.color};">${b.title(selectedHero)}</div>
        <div class="board-col-count">${heroesInBucket.length}</div>
      </div>
      <div class="board-col-body">${heroesInBucket.length===0 ? '<span class="board-col-empty">Arrastrá acá</span>' : ''}</div>`;
    board.appendChild(col);

    // el detector de soltar va en TODA la columna (no solo en el listado interno) -- si la
    // tabla queda vacia, el listado interno mide 0 de alto (no tiene tarjetas que le den
    // tamaño) y el mouse termina soltando sobre el contenedor de afuera, que antes no tenia
    // el evento enganchado y por eso no dejaba meter nada en una tabla vacia.
    col.ondragover = (e)=>{ e.preventDefault(); col.classList.add("drag-over"); };
    col.ondragleave = ()=>{ col.classList.remove("drag-over"); };
    col.ondrop = (e)=>{
      e.preventDefault();
      col.classList.remove("drag-over");
      const heroName = e.dataTransfer.getData("text/plain");
      if(heroName) moveToBucket(heroName, b.key);
    };

    const body = col.querySelector(".board-col-body");
    heroesInBucket.forEach(h=>{
      const val = row[h.n];
      const tagColor = val===undefined ? "var(--muted)" : b.color;
      const iconSrc = heroIconSrc(h.n);
      const card = document.createElement("div");
      card.className = "hero-card";
      card.draggable = true;
      card.innerHTML = `${iconSrc ? `<img src="${iconSrc}" class="hero-card-icon" alt="">` : ""}<span class="n">${h.n}</span><span class="score-tag" style="color:${tagColor};border-color:${tagColor};">${val===undefined?'–':(val>0?'+':'')+val}</span>`;
      card.ondragstart = (e)=>{
        e.dataTransfer.setData("text/plain", h.n);
        e.dataTransfer.effectAllowed = "move";
        card.classList.add("dragging");
      };
      card.ondragend = ()=> card.classList.remove("dragging");
      card.onclick = ()=>{
        const cur = row[h.n] === undefined ? 0 : row[h.n];
        setScore(selectedHero, h.n, cur+1);
        renderTarget();
        renderOverall();
      };
      card.oncontextmenu = (e)=>{
        e.preventDefault();
        const cur = row[h.n] === undefined ? 0 : row[h.n];
        setScore(selectedHero, h.n, cur-1);
        renderTarget();
        renderOverall();
      };
      body.appendChild(card);
    });
  });
}

document.getElementById("exportBtn").onclick = ()=>{
  const payload = {scores};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "matchup-scores-export.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById("importInput").onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed.scores) scores = parsed.scores;
      save();
      renderPickGrid();
      renderTarget();
      renderOverall();
    }catch(err){ alert("JSON inválido."); }
  };
  reader.readAsText(file);
  e.target.value = "";
};

load();
renderPickGrid();
renderTarget();
renderOverall();
</script>
</body>
</html>
